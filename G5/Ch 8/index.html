<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innovine Educational Game - हिंदवी स्वराज्य</title>
    <style>
        :root {
            --primary-color: #ea580c;
            --secondary-color: #f97316;
            --bg-color: #fff7ed;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #fdba74;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 600px;
            height: 92vh;
            max-height: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.15);
            border: 4px solid var(--primary-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Start Screen */
        #start-screen {
            justify-content: center;
            align-items: center;
            gap: 40px;
            text-align: center;
        }

        .logo-img {
            max-width: 240px;
            height: auto;
            object-fit: contain;
        }

        .btn-main {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-main:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        /* Dashboard Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }

        .level-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .score-counter {
            background: var(--bg-color);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
            font-weight: 700;
            font-size: 16px;
        }

        /* Quiz Container for Level 1 & 2 */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            justify-content: center;
        }

        .question-card {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #ffedd5;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #15803d !important;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--danger-color) !important;
            color: #b91c1c !important;
        }

        /* End Screen */
        #end-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        .congrats-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1.4;
        }

        .final-score {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">

        <!-- Audio Elements -->
        <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
        <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" class="logo-img" id="logo-img">
            <button class="btn-main" onclick="startGame()">Start Game</button>
        </div>

        <!-- Level 1 Screen: Chapter Questions -->
        <div id="level1-screen" class="screen">
            <div class="dashboard-header">
                <div class="level-title">Level 1: पाठ्यबोध</div>
                <div class="score-counter" id="l1-score">Score: 0</div>
            </div>
            <div class="quiz-container">
                <div class="question-card" id="l1-question">प्रश्न यहाँ आएगा...</div>
                <div class="options-grid" id="l1-options"></div>
            </div>
        </div>

        <!-- Level 2 Screen: Grammar Topics -->
        <div id="level2-screen" class="screen">
            <div class="dashboard-header">
                <div class="level-title">Level 2: व्याकरण बोध</div>
                <div class="score-counter" id="l2-score">Score: 0</div>
            </div>
            <div class="quiz-container">
                <div class="question-card" id="l2-question">व्याकरण प्रश्न यहाँ आएगा...</div>
                <div class="options-grid" id="l2-options"></div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <div class="congrats-text">🎉 Congratulations! 🎉<br>Well Done!</div>
            <div class="final-score" id="final-score-text">Total Score: 0</div>
            <button class="btn-main" onclick="resetToStart()">Replay</button>
        </div>

    </div>

    <script>
        // Level 1 Data (Chapter Questions requested by user)
        const level1Data = [
            {
                question: "सही विकल्प चुनकर वाक्य पूरा कीजिए:\nचीता बहुत तेज़, चुस्त और ________ जानवर है।",
                options: [
                    "a) अचूक",
                    "b) समर्पित",
                    "c) फुर्तीला",
                    "d) छत्रपति"
                ],
                correctIndex: 2
            },
            {
                question: "जो व्यक्ति पूरे मन से किसी काम में लगा हो, वह कैसा होता है?",
                options: [
                    "a) फुर्तीला",
                    "b) समर्पित",
                    "c) अचूक",
                    "d) छत्रपति"
                ],
                correctIndex: 1
            }
        ];

        // Level 2 Data (Grammar topics from Chapter: अनेकार्थक & अनेक शब्दों के लिए एक शब्द)
        const level2Data = [
            {
                question: "'जो सबकी रक्षा करता है' - अनेक शब्दों के लिए एक शब्द चुनिए:",
                options: [
                    "a) अमर",
                    "b) रक्षक",
                    "c) सर्वदर्शी",
                    "d) दूरदर्शी"
                ],
                correctIndex: 1
            },
            {
                question: "'हार' शब्द के दो अलग-अलग अर्थ (अनेकार्थक) कौन-से हैं?",
                options: [
                    "a) पराजय और माला",
                    "b) जीत और गहना",
                    "c) समय और धागा",
                    "d) हारना और थकना"
                ],
                correctIndex: 0
            },
            {
                question: "'जो आगे की सोचता है' - वाक्यांश के लिए सही शब्द चुनिए:",
                options: [
                    "a) निरक्षर",
                    "b) अमर",
                    "c) दूरदर्शी",
                    "d) रक्षक"
                ],
                correctIndex: 2
            }
        ];

        // State Variables
        let totalScore = 0;
        let currentL1Index = 0;
        let currentL2Index = 0;
        let canAnswer = true;

        // Image fallback handler
        document.getElementById('logo-img').onerror = function() {
            this.style.display = 'none';
            const textLogo = document.createElement('h1');
            textLogo.innerText = 'INNOVINE';
            textLogo.style.color = '#ea580c';
            textLogo.style.fontSize = '36px';
            document.getElementById('start-screen').insertBefore(textLogo, document.querySelector('#start-screen .btn-main'));
        };

        // Screen Switcher
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Sound Effects
        function playSound(type) {
            const correctAudio = document.getElementById('audio-correct');
            const wrongAudio = document.getElementById('audio-wrong');
            
            if (type === 'correct') {
                correctAudio.currentTime = 0;
                correctAudio.play().catch(() => {});
            } else if (type === 'wrong') {
                wrongAudio.currentTime = 0;
                wrongAudio.play().catch(() => {});
            }
        }

        // Game Start / Reset
        function startGame() {
            totalScore = 0;
            currentL1Index = 0;
            currentL2Index = 0;
            loadLevel1Question();
            showScreen('level1-screen');
        }

        function resetToStart() {
            showScreen('start-screen');
        }

        /* --- LEVEL 1 LOGIC --- */
        function loadLevel1Question() {
            canAnswer = true;
            document.getElementById('l1-score').innerText = `Score: ${totalScore}`;
            const qData = level1Data[currentL1Index];
            
            document.getElementById('l1-question').innerText = qData.question;
            const optionsContainer = document.getElementById('l1-options');
            optionsContainer.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkL1Answer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkL1Answer(selectedIndex, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const qData = level1Data[currentL1Index];
            const allBtns = document.querySelectorAll('#l1-options .option-btn');

            if (selectedIndex === qData.correctIndex) {
                playSound('correct');
                btnElement.classList.add('correct');
                totalScore += 10;
                document.getElementById('l1-score').innerText = `Score: ${totalScore}`;
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                allBtns[qData.correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                currentL1Index++;
                if (currentL1Index < level1Data.length) {
                    loadLevel1Question();
                } else {
                    initLevel2();
                }
            }, 1200);
        }

        /* --- LEVEL 2 LOGIC --- */
        function initLevel2() {
            currentL2Index = 0;
            showScreen('level2-screen');
            loadLevel2Question();
        }

        function loadLevel2Question() {
            canAnswer = true;
            document.getElementById('l2-score').innerText = `Score: ${totalScore}`;
            const qData = level2Data[currentL2Index];

            document.getElementById('l2-question').innerText = qData.question;
            const optionsContainer = document.getElementById('l2-options');
            optionsContainer.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkL2Answer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkL2Answer(selectedIndex, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const qData = level2Data[currentL2Index];
            const allBtns = document.querySelectorAll('#l2-options .option-btn');

            if (selectedIndex === qData.correctIndex) {
                playSound('correct');
                btnElement.classList.add('correct');
                totalScore += 10;
                document.getElementById('l2-score').innerText = `Score: ${totalScore}`;
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                allBtns[qData.correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                currentL2Index++;
                if (currentL2Index < level2Data.length) {
                    loadLevel2Question();
                } else {
                    endGame();
                }
            }, 1200);
        }

        /* --- END GAME --- */
        function endGame() {
            document.getElementById('final-score-text').innerText = `Total Score: ${totalScore}`;
            showScreen('end-screen');
        }
    </script>
</body>
</html>
