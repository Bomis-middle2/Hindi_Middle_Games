<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पेड़ों की महिमा - सही या गलत</title>
<style>
  :root { --primary: #15803d; --bg: #f0fdf4; --card: #ffffff; }
  body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .game-card { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
  .statement-box { background: #dcfce7; padding: 25px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; color: #14532d; margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  .btn-container { display: flex; gap: 15px; justify-content: center; }
  .btn-choice { padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .btn-true { background: #22c55e; color: white; }
  .btn-false { background: #ef4444; color: white; }
  .btn-choice:hover { transform: scale(1.05); }
  .feedback { margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 30px; }
</style>
</head>
<body>
<div class="game-card">
  <h2>पेड़ों की महिमा - सही या गलत?</h2>
  <div style="margin-top: 10px; color: #64748b;">अंक: <span id="score">0</span></div>
  <div class="statement-box" id="statement">कथन यहाँ आएगा...</div>
  <div class="btn-container">
    <button class="btn-choice btn-true" onclick="checkAnswer(true)">सही (True)</button>
    <button class="btn-choice btn-false" onclick="checkAnswer(false)">गलत (False)</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <button id="nextBtn" style="display:none; margin: 20px auto 0; padding: 10px 20px; background: #15803d; color: white; border: none; border-radius: 6px; cursor: pointer;" onclick="loadNext()">अगला प्रश्न ➔</button>
</div>

<script>
  const questions = [
    { text: "पेड़ों को पर्यावरण का 'हरा सोना' कहा जाता है।", ans: true },
    { text: "पेड़ ऑक्सीजन ग्रहण करते हैं और कार्बन डाइऑक्साइड छोड़ते हैं।", ans: false },
    { text: "विश्व पर्यावरण दिवस 5 जून को मनाया जाता है।", ans: true },
    { text: "भगवान बुद्ध को बरगद के पेड़ के नीचे ज्ञान प्राप्त हुआ था।", ans: false }
  ];
  let index = 0, score = 0;

  function loadNext() {
    if(index >= questions.length) {
      document.querySelector('.game-card').innerHTML = `<h2>खेल समाप्त!</h2><p style="font-size:1.5rem; margin:20px 0;">आपका कुल अंक: ${score} / ${questions.length * 10}</p><button onclick="location.reload()" class="btn-choice btn-true">पुनः खेलें</button>`;
      return;
    }
    document.getElementById('statement').innerText = questions[index].text;
    document.getElementById('feedback').innerText = '';
    document.getElementById('nextBtn').style.display = 'none';
  }

  function checkAnswer(userAns) {
    const isCorrect = userAns === questions[index].ans;
    const fb = document.getElementById('feedback');
    if(isCorrect) {
      score += 10;
      document.getElementById('score').innerText = score;
      fb.innerText = "🎉 सही उत्तर!"; fb.style.color = "#22c55e";
    } else {
      fb.innerText = "❌ गलत उत्तर!"; fb.style.color = "#ef4444";
    }
    document.getElementById('nextBtn').style.display = 'block';
    index++;
  }
  loadNext();
</script>
</body>
</html>
