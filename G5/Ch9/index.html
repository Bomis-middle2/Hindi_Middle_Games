<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Burst Game - योग दिवस</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }
        h1 {
            margin: 0 0 5px 0;
            color: #2c3e50;
            font-size: 22px;
        }
        .info-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
        }
        #question-box {
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
            color: #d35400;
            background: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-width: 90%;
        }
        #game-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }
        .balloon {
            position: absolute;
            bottom: -140px;
            width: 110px;
            height: 130px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);
            animation: floatUp 6s linear forwards;
            line-height: 1.2;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid inherit;
        }
        .string {
            position: absolute;
            bottom: -24px;
            left: 50%;
            width: 2px;
            height: 25px;
            background-color: #777;
        }
        @keyframes floatUp {
            0% {
                bottom: -140px;
                opacity: 1;
            }
            100% {
                bottom: 105%;
                opacity: 1;
            }
        }
        .pop {
            animation: popAnimation 0.3s ease-out forwards !important;
        }
        @keyframes popAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 20;
            max-width: 90%;
            width: 350px;
        }
        .modal button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>🎈 अध्याय 9: योग दिवस (Balloon Burst Game)</h1>
        <div class="info-bar">
            <span>स्तर (Level): <span id="level-num">1</span>/2</span>
            <span>अंक (Score): <span id="score">0</span></span>
        </div>
        <div id="question-box">प्रश्न लोड हो रहा है...</div>
    </div>

    <div id="game-container"></div>

    <!-- Level Transition Modal -->
    <div id="level-modal" class="modal">
        <h2 id="level-title">🎉 Level 1 पूरा हुआ!</h2>
        <p id="level-desc">अब Level 2 (व्याकरण बोध - विशेषण) शुरू होगा।</p>
        <button onclick="nextLevel()">Level 2 शुरू करें ➔</button>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal">
        <h2>🏆 शानदार! आपने खेल पूरा कर लिया!</h2>
        <p id="final-score">आपका कुल अंक: 0</p>
        <button onclick="restartGame()">फिर से खेलें 🔄</button>
    </div>

    <script>
        // Level 1: Chapter Questions (पाठ-बोध)
        const level1Questions = [
            {
                q: "अंतर्राष्ट्रीय योग दिवस कब मनाया जाता है?",
                options: ["21 जून", "15 अगस्त", "26 जनवरी", "21 मई"],
                correct: "21 जून"
            },
            {
                q: "'योग' शब्द संस्कृत के किस शब्द से बना है?",
                options: ["युज", "योगी", "योग्यता", "युग"],
                correct: "युज"
            },
            {
                q: "आधुनिक योग का जनक किसे माना जाता है?",
                options: ["महर्षि पतंजलि", "स्वामी विवेकानंद", "महर्षि वेदव्यास", "गुरु दीपक जी"],
                correct: "महर्षि पतंजलि"
            },
            {
                q: "पाचन तंत्र के लिए कौन-सा आसन सबसे अच्छा है?",
                options: ["वज्रासन", "ताड़ासन", "वृक्षासन", "शवासन"],
                correct: "वज्रासन"
            },
            {
                q: "शरीर में संतुलन लाने वाला आसन कौन-सा है?",
                options: ["वृक्षासन", "शवासन", "भुजंगासन", "वज्रासन"],
                correct: "वृक्षासन"
            }
        ];

        // Level 2: Grammar Questions (व्याकरण बोध - विशेषण)
        const level2Questions = [
            {
                q: "'रंग-बिरंगी चटाइयाँ' - इसमें विशेषण शब्द क्या है?",
                options: ["रंग-बिरंगी", "चटाइयाँ", "बिछी", "हैं"],
                correct: "रंग-बिरंगी"
            },
            {
                q: "'शांत', 'सुलभ' या 'सुंदर' किस प्रकार के विशेषण हैं?",
                options: ["गुणवाचक", "संख्यावाचक", "परिमाणवाचक", "सार्वनामिक"],
                correct: "गुणवाचक"
            },
            {
                q: "'दो बार', 'चार फल' किस विशेषण के उदाहरण हैं?",
                options: ["संख्यावाचक", "गुणवाचक", "परिमाणवाचक", "सार्वनामिक"],
                correct: "संख्यावाचक"
            },
            {
                q: "'थोड़ा पानी', 'दो किलो' किस विशेषण के उदाहरण हैं?",
                options: ["परिमाणवाचक", "संख्यावाचक", "गुणवाचक", "सार्वनामिक"],
                correct: "परिमाणवाचक"
            },
            {
                q: "'वह लड़का', 'यह किताब' में 'वह' और 'यह' कौन से विशेषण हैं?",
                options: ["सार्वनामिक", "गुणवाचक", "संख्यावाचक", "परिमाणवाचक"],
                correct: "सार्वनामिक"
            }
        ];

        const colors = ["#FF5733", "#2ECC71", "#3498DB", "#F1C40F", "#9B59B6", "#E67E22"];

        let currentLevel = 1;
        let currentQIndex = 0;
        let score = 0;
        let balloonInterval;
        let activeQuestions = [];
        let isQuestionTransitioning = false;

        const questionBox = document.getElementById("question-box");
        const scoreDisplay = document.getElementById("score");
        const levelDisplay = document.getElementById("level-num");
        const gameContainer = document.getElementById("game-container");
        const levelModal = document.getElementById("level-modal");
        const gameOverModal = document.getElementById("game-over-modal");

        function startGame() {
            score = 0;
            currentLevel = 1;
            currentQIndex = 0;
            isQuestionTransitioning = false;
            scoreDisplay.innerText = score;
            levelDisplay.innerText = currentLevel;
            levelModal.style.display = "none";
            gameOverModal.style.display = "none";
            activeQuestions = level1Questions;
            loadQuestion();
        }

        function loadQuestion() {
            clearBalloons();
            isQuestionTransitioning = false;

            if (currentQIndex >= activeQuestions.length) {
                if (currentLevel === 1) {
                    showLevelTransition();
                } else {
                    endGame();
                }
                return;
            }

            const qData = activeQuestions[currentQIndex];
            questionBox.innerText = `L${currentLevel} Q${currentQIndex + 1}: ${qData.q}`;

            // विकल्पों को रैंडम क्रम (Shuffle) में प्रस्तुत करना
            let shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
            let optionIndex = 0;

            // पहला गुब्बारा तुरंत छोड़ें
            spawnBalloon(shuffledOptions[optionIndex], qData.correct);
            optionIndex++;

            // लगातार गुब्बारे ऊपर भेजने का लूप
            balloonInterval = setInterval(() => {
                if (isQuestionTransitioning) return;
                
                spawnBalloon(shuffledOptions[optionIndex], qData.correct);
                optionIndex = (optionIndex + 1) % shuffledOptions.length;
            }, 1400);
        }

        function spawnBalloon(text, correctAnswer) {
            const balloon = document.createElement("div");
            balloon.className = "balloon";
            
            const maxLeft = Math.max(20, gameContainer.offsetWidth - 130);
            const randomLeft = Math.floor(Math.random() * maxLeft);
            balloon.style.left = randomLeft + "px";

            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = randomColor;

            balloon.innerText = text;

            const string = document.createElement("div");
            string.className = "string";
            balloon.appendChild(string);

            balloon.onclick = function() {
                if (!isQuestionTransitioning) {
                    popBalloon(balloon, text, correctAnswer);
                }
            };

            balloon.addEventListener('animationend', () => {
                balloon.remove();
            });

            gameContainer.appendChild(balloon);
        }

        function popBalloon(balloon, selectedText, correctAnswer) {
            balloon.classList.add("pop");

            setTimeout(() => {
                balloon.remove();
            }, 300);

            if (selectedText === correctAnswer) {
                isQuestionTransitioning = true;
                score += 10;
                scoreDisplay.innerText = score;
                currentQIndex++;
                clearInterval(balloonInterval);
                setTimeout(loadQuestion, 600);
            } else {
                score = Math.max(0, score - 2);
                scoreDisplay.innerText = score;
            }
        }

        function clearBalloons() {
            clearInterval(balloonInterval);
            gameContainer.innerHTML = "";
        }

        function showLevelTransition() {
            clearBalloons();
            questionBox.innerText = "Level 1 पूरा!";
            levelModal.style.display = "block";
        }

        function nextLevel() {
            currentLevel = 2;
            currentQIndex = 0;
            levelDisplay.innerText = currentLevel;
            activeQuestions = level2Questions;
            levelModal.style.display = "none";
            loadQuestion();
        }

        function endGame() {
            clearBalloons();
            questionBox.innerText = "खेल समाप्त!";
            document.getElementById("final-score").innerText = `आपका कुल अंक: ${score}`;
            gameOverModal.style.display = "block";
        }

        function restartGame() {
            startGame();
        }

        window.onload = startGame;
    </script>
</body>
</html>
