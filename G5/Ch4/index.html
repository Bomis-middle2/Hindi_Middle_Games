<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>होली - Grammar Time Attack</title>
<style>
  :root { --primary: #9333ea; --bg: #f3e8ff; --card: #ffffff; }
  body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .game-card { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
  .level-badge { display: inline-block; background: #e9d5ff; color: #6b21a8; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
  .timer-bar { height: 8px; background: #e9d5ff; border-radius: 4px; margin: 15px 0; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--primary); width: 100%; transition: width 0.1s linear; }
  .status-bar { display: flex; justify-content: space-between; font-weight: bold; color: #4c1d95; margin-bottom: 15px; }
  .question-box { background: #faf5ff; padding: 20px; border: 2px dashed #c084fc; border-radius: 12px; font-size: 1.2rem; font-weight: bold; color: #581c87; margin-bottom: 20px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-opt { padding: 14px; font-size: 1rem; font-weight: bold; border: 2px solid #e9d5ff; background: #ffffff; color: #581c87; border-radius: 10px; cursor: pointer; transition: 0.2s; }
  .btn-opt:hover { background: #f3e8ff; transform: translateY(-2px); }
  .feedback { margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 25px; }
</style>
</head>
<body>

<div class="game-card">
  <h2>🎨 होली - व्याकरण टाइम अटैक</h2>
  <div class="level-badge" id="levelBadge">Level 1</div>
  
  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
  <div class="status-bar">
    <span>अंक: <span id="score">0</span></span>
    <span>समय: <span id="timeLeft">10</span>s</span>
  </div>
  
  <div class="question-box" id="question">प्रश्न लोड हो रहा है...</div>
  <div class="options-grid" id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>

<script>
  const questions = [
    // Level 1: Word Unscramble (शब्द-सेतु)
    { lvl: "Level 1: सही शब्द चुनो", q: "अक्षरों को सही क्रम दें: 'गाासौौत'", options: ["सौगात", "गातसौ", "तसाौग", "सौताग"], ans: 0 },
    { lvl: "Level 1: सही शब्द चुनो", q: "अक्षरों को सही क्रम दें: 'जियाारााउ'", options: ["राजिउआ", "उजियारा", "याराउजि", "उराजिया"], ans: 1 },
    { lvl: "Level 1: सही शब्द चुनो", q: "अक्षरों को सही क्रम दें: 'रत्योोहाा'", options: ["हारत्यो", "त्योहार", "हारत्यो", "त्योहारा"], ans: 1 },
    { lvl: "Level 1: सही शब्द चुनो", q: "अक्षरों को सही क्रम दें: 'पहाारउ'", options: ["उपहार", "हारउप", "उ पहार", "पहारउ"], ans: 0 },
    
    // Level 2: Grammar - Synonyms & Antonyms (पर्यायवाची व विलोम)
    { lvl: "Level 2: व्याकरण बोध", q: "'मित्र' का सही पर्यायवाची क्या होगा?", options: ["शत्रु", "सखा", "निकट", "सफलता"], ans: 1 },
    { lvl: "Level 2: व्याकरण बोध", q: "'निकट' शब्द का विलोम शब्द क्या है?", options: ["पास", "दूर", "सामने", "समीप"], ans: 1 },
    { lvl: "Level 2: व्याकरण बोध", q: "'अपरिचित' का विलोम शब्द क्या होगा?", options: ["अज्ञान", "परिचित", "अनजान", "मित्र"], ans: 1 },
    { lvl: "Level 2: व्याकरण बोध", q: "'जीवन' का सही विलोम शब्द क्या है?", options: ["सफलता", "मरण", "अमर", "उजियारा"], ans: 1 }
  ];

  let index = 0, score = 0, timeLeft = 10, timerInterval = null;

  function startTimer() {
    timeLeft = 10;
    document.getElementById('timeLeft').innerText = timeLeft;
    document.getElementById('timerFill').style.width = '100%';
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      document.getElementById('timeLeft').innerText = Math.max(0, Math.ceil(timeLeft));
      document.getElementById('timerFill').style.width = (timeLeft / 10 * 100) + '%';
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        showFeedback(false, "⌛ समय समाप्त!");
        setTimeout(nextQuestion, 1200);
      }
    }, 100);
  }

  function loadQuestion() {
    if (index >= questions.length) {
      clearInterval(timerInterval);
      document.querySelector('.game-card').innerHTML = `
        <h2>🏆 शानदार खेल!</h2>
        <p style="font-size:1.4rem; margin:20px 0;">आपका कुल अंक: <b>${score}</b> / ${questions.length * 10}</p>
        <button onclick="location.reload()" class="btn-opt" style="background:var(--primary); color:white; width:100%;">पुनः खेलें</button>
      `;
      return;
    }

    const current = questions[index];
    document.getElementById('levelBadge').innerText = current.lvl;
    document.getElementById('question').innerText = current.q;
    document.getElementById('feedback').innerText = '';
    
    const optsBox = document.getElementById('options');
    optsBox.innerHTML = '';
    
    current.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(idx);
      optsBox.appendChild(btn);
    });

    startTimer();
  }

  function checkAnswer(selectedIdx) {
    clearInterval(timerInterval);
    const correctIdx = questions[index].ans;
    const isCorrect = selectedIdx === correctIdx;
    
    if (isCorrect) {
      score += 10;
      document.getElementById('score').innerText = score;
      showFeedback(true, "✅ बिल्कुल सही!");
    } else {
      showFeedback(false, `❌ गलत! सही उत्तर: ${questions[index].options[correctIdx]}`);
    }

    setTimeout(nextQuestion, 1200);
  }

  function showFeedback(isCorrect, msg) {
    const fb = document.getElementById('feedback');
    fb.innerText = msg;
    fb.style.color = isCorrect ? "#16a34a" : "#dc2626";
    
    const btns = document.querySelectorAll('.btn-opt');
    btns.forEach(b => b.disabled = true);
  }

  function nextQuestion() {
    index++;
    loadQuestion();
  }

  loadQuestion();
</script>
</body>
</html>
