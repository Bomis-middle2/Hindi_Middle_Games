<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पाठ 4: होली - व्याकरण अभ्यास खेल</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #e8f5e9;
      color: #1b5e20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 1. START SCREEN */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 3px solid #81c784;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 650px;
      padding: 50px 20px;
      text-align: center;
    }

    .start-logo {
      max-width: 220px;
      height: auto;
      margin-bottom: 30px;
    }

    .btn-main {
      background-color: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-main:hover {
      background-color: #1b5e20;
      transform: scale(1.03);
    }

    /* 2. GAME CONTAINER */
    #game-container {
      display: none;
      background: #ffffff;
      border: 3px solid #81c784;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 700px;
      padding: 20px;
    }

    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #c8e6c9;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #1b5e20;
    }

    .level-title {
      font-size: 1.2rem;
      color: #2e7d32;
      margin-bottom: 15px;
      text-align: center;
    }

    /* LEVEL 1: GRAMMAR MCQ (पर्यायवाची एवं विलोम) */
    .quiz-card {
      background: #f1f8e9;
      border: 2px dashed #81c784;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
    }

    .quiz-question {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .option-btn {
      background-color: #ffffff;
      border: 2px solid #81c784;
      color: #1b5e20;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    .option-btn:hover {
      background-color: #c8e6c9;
      transform: translateY(-2px);
    }

    /* LEVEL 2: SORTING GAME (पर्यायवाची/विलोम वर्गीकरण) */
    #catch-game-area {
      position: relative;
      width: 100%;
      height: 380px;
      background: #f1f8e9;
      border: 2px dashed #81c784;
      border-radius: 8px;
      overflow: hidden;
    }

    .falling-word {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #2e7d32;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.05rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      white-space: nowrap;
    }

    .baskets-container {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 10px;
    }

    .basket-btn {
      background: #81c784;
      color: #ffffff;
      border: 2px solid #2e7d32;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      flex: 1;
      margin: 0 8px;
      text-align: center;
      transition: background 0.2s;
    }

    .basket-btn:hover {
      background: #2e7d32;
    }

    /* 3. END SCREEN */
    #end-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 3px solid #81c784;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 650px;
      padding: 50px 20px;
      text-align: center;
    }

    .congrats-text {
      font-size: 2rem;
      color: #2e7d32;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .final-score {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #1b5e20;
    }

    .feedback-msg {
      height: 24px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- 1. START SCREEN -->
  <div id="start-screen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" class="start-logo">
    <button class="btn-main" onclick="startGame()">Start Game</button>
  </div>

  <!-- 2. GAME CONTAINER -->
  <div id="game-container">
    <div class="dashboard">
      <div id="level-display">स्तर 1: पर्यायवाची एवं विलोम शब्द</div>
      <div>अंक (Score): <span id="score">0</span></div>
    </div>

    <!-- LEVEL 1: GRAMMAR MCQ -->
    <div id="level-1-area">
      <h2 class="level-title">व्याकरण बोध (सही विकल्प चुनें)</h2>
      <p style="text-align: center; margin-bottom: 10px; font-size: 0.95rem;">पाठ 4 (होली) के आधार पर सही उत्तर चुनें:</p>
      
      <div class="quiz-card">
        <div class="quiz-question" id="l1-question">प्रश्न लोड हो रहा है...</div>
        <div class="options-grid" id="l1-options"></div>
      </div>
      <div class="feedback-msg" id="l1-feedback"></div>
    </div>

    <!-- LEVEL 2: SORTING GAME -->
    <div id="level-2-area" style="display: none;">
      <h2 class="level-title">शब्द-भेद छाँटें (Sort Words)</h2>
      <p style="text-align: center; margin-bottom: 10px; font-size: 0.95rem;">गिरते हुए शब्द युग्म के लिए सही व्याकरण भेद चुनें:</p>
      
      <div id="catch-game-area">
        <div id="falling-word" class="falling-word">शब्द युग्म</div>
        <div class="baskets-container">
          <button class="basket-btn" onclick="checkBasket('पर्यायवाची शब्द')">पर्यायवाची शब्द</button>
          <button class="basket-btn" onclick="checkBasket('विलोम शब्द')">विलोम शब्द</button>
        </div>
      </div>
      <div class="feedback-msg" id="l2-feedback"></div>
    </div>
  </div>

  <!-- 3. END SCREEN -->
  <div id="end-screen">
    <div class="congrats-text">🎉 Congratulations! 🎉 Well Done!</div>
    <div class="final-score">आपका कुल स्कोर: <span id="final-score-val">0</span></div>
    <button class="btn-main" onclick="resetGame()">Replay</button>
  </div>

  <!-- AUDIO ELEMENTS -->
  <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
  <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

  <script>
    let score = 0;
    let l1Index = 0;

    // LEVEL 1 DATA: Based on Chapter 4 Grammar (Synonyms & Antonyms from PDF Page 38)
    const l1Data = [
      {
        q: "'मित्र' शब्द का सही पर्यायवाची शब्द क्या होगा?",
        opts: ["सखा / दोस्त", "शत्रु", "रिपु"],
        ans: 0
      },
      {
        q: "'निकट' शब्द का सही विलोम (विपरीतार्थक) शब्द क्या है?",
        opts: ["पास", "दूर", "समीप"],
        ans: 1
      },
      {
        q: "'प्रेम' शब्द का पर्यायवाची शब्द चुनिए:",
        opts: ["प्यार / स्नेह", "नफ़रत", "क्रोध"],
        ans: 0
      },
      {
        q: "'सफ़लता' शब्द का सही विलोम शब्द क्या है?",
        opts: ["जय", "विजय", "असफ़लता"],
        ans: 2
      }
    ];

    // LEVEL 2 DATA: Sorting pairs based on PDF Chapter 4 (Synonym vs Antonym)
    const l2Data = [
      { word: "शत्रु = रिपु", type: "पर्यायवाची शब्द" },
      { word: "जीवन ↔ मरण", type: "विलोम शब्द" },
      { word: "आज़ादी = स्वतंत्रता", type: "पर्यायवाची शब्द" },
      { word: "अपरिचित ↔ परिचित", type: "विलोम शब्द" },
      { word: "उपहार = सौगात", type: "पर्यायवाची शब्द" },
      { word: "प्रेम ↔ नफ़रत", type: "विलोम शब्द" },
      { word: "उजियारा = प्रकाश", type: "पर्यायवाची शब्द" },
      { word: "सफ़लता ↔ असफ़लता", type: "विलोम शब्द" }
    ];

    let l2Index = 0;
    let fallInterval = null;
    let currentTop = 0;

    function playSound(isCorrect) {
      const audio = document.getElementById(isCorrect ? 'audio-correct' : 'audio-wrong');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
    }

    function updateScore(points) {
      score += points;
      document.getElementById('score').innerText = score;
    }

    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      l1Index = 0;
      loadL1Question();
    }

    /* --- LEVEL 1 LOGIC (MCQ) --- */
    function loadL1Question() {
      if (l1Index >= l1Data.length) {
        startLevel2();
        return;
      }

      const item = l1Data[l1Index];
      document.getElementById('l1-question').innerText = item.q;
      const optsContainer = document.getElementById('l1-options');
      optsContainer.innerHTML = '';
      document.getElementById('l1-feedback').innerText = '';

      item.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkL1Answer(idx);
        optsContainer.appendChild(btn);
      });
    }

    function checkL1Answer(selectedIdx) {
      const item = l1Data[l1Index];
      const fb = document.getElementById('l1-feedback');

      if (selectedIdx === item.ans) {
        playSound(true);
        fb.style.color = 'green';
        fb.innerText = 'बिल्कुल सही! 🎉 (+10)';
        updateScore(10);
        l1Index++;
        setTimeout(loadL1Question, 1200);
      } else {
        playSound(false);
        fb.style.color = 'red';
        fb.innerText = 'गलत उत्तर, पुनः प्रयास करें!';
      }
    }

    /* --- LEVEL 2 LOGIC (Synonym / Antonym Catch Game) --- */
    function startLevel2() {
      document.getElementById('level-1-area').style.display = 'none';
      document.getElementById('level-2-area').style.display = 'block';
      document.getElementById('level-display').innerText = 'स्तर 2: पर्यायवाची व विलोम वर्गीकरण';
      l2Index = 0;
      spawnFallingWord();
    }

    function spawnFallingWord() {
      if (l2Index >= l2Data.length) {
        endGame();
        return;
      }

      const wordElem = document.getElementById('falling-word');
      wordElem.innerText = l2Data[l2Index].word;
      currentTop = 0;
      wordElem.style.top = currentTop + 'px';

      clearInterval(fallInterval);
      fallInterval = setInterval(() => {
        currentTop += 2;
        wordElem.style.top = currentTop + 'px';

        if (currentTop >= 280) {
          clearInterval(fallInterval);
          playSound(false);
          document.getElementById('l2-feedback').style.color = 'red';
          document.getElementById('l2-feedback').innerText = 'समय समाप्त! अगला शब्द...';
          l2Index++;
          setTimeout(spawnFallingWord, 1000);
        }
      }, 50);
    }

    function checkBasket(selectedType) {
      if (l2Index >= l2Data.length) return;

      clearInterval(fallInterval);
      const correctType = l2Data[l2Index].type;
      const fb = document.getElementById('l2-feedback');

      if (selectedType === correctType) {
        playSound(true);
        fb.style.color = 'green';
        fb.innerText = 'सही वर्गीकरण! 🎉 (+10)';
        updateScore(10);
      } else {
        playSound(false);
        fb.style.color = 'red';
        fb.innerText = `गलत! सही उत्तर '${correctType}' था।`;
      }

      l2Index++;
      setTimeout(spawnFallingWord, 1200);
    }

    /* --- END GAME --- */
    function endGame() {
      clearInterval(fallInterval);
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('end-screen').style.display = 'flex';
      document.getElementById('final-score-val').innerText = score;
    }

    function resetGame() {
      score = 0;
      document.getElementById('score').innerText = '0';
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('level-2-area').style.display = 'none';
      document.getElementById('level-1-area').style.display = 'block';
      document.getElementById('level-display').innerText = 'स्तर 1: पर्यायवाची एवं विलोम शब्द';
      document.getElementById('start-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
