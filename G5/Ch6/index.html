<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मिट्ठू और गोपाल - केले पकड़ो खेल</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 5px;
      font-size: 1.8rem;
      text-align: center;
    }

    p.subtitle {
      color: #555;
      margin-bottom: 15px;
      font-size: 0.95rem;
      text-align: center;
    }

    #game-container {
      position: relative;
      width: 400px;
      height: 500px;
      background: linear-gradient(to bottom, #87ceeb 0%, #e0f7fa 70%, #81c784 100%);
      border: 4px solid #2e7d32;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    /* Game Header UI */
    .scoreboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.1rem;
      color: #1b5e20;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      z-index: 5;
    }

    /* Mitthu Player */
    #mitthu {
      position: absolute;
      bottom: 10px;
      left: 170px;
      width: 60px;
      height: 60px;
      font-size: 45px;
      text-align: center;
      line-height: 60px;
      user-select: none;
      transition: left 0.05s linear;
    }

    /* Falling Items */
    .falling-item {
      position: absolute;
      width: 40px;
      height: 40px;
      font-size: 32px;
      text-align: center;
      line-height: 40px;
      user-select: none;
    }

    /* Start / Game Over Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #ffeb3b;
    }

    .overlay p {
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      background-color: #388e3c;
      transform: scale(1.05);
    }

    /* Mobile Controls */
    .controls {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    .control-btn {
      background-color: #81c784;
      color: #1b5e20;
      border: 2px solid #2e7d32;
      width: 80px;
      height: 50px;
      font-size: 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .control-btn:active {
      background-color: #4caf50;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🐒 मिट्ठू और गोपाल 🍌</h1>
  <p class="subtitle">गोपाल के दिए केले और चने पकड़ें, चीते के पंजों 🐾 से बचें!</p>

  <div id="game-container">
    <div class="scoreboard">
      <span>अंक: <span id="score">0</span></span>
      <span>जीवन: <span id="lives">3</span></span>
    </div>

    <div id="mitthu">🐒</div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <h2>सर्कस का खेल</h2>
      <p>मिट्ठू को बाएँ/दाएँ चलाकर केले 🍌 और चने 🫘 एकत्र करें।<br>चीते के पंजों 🐾 से बचें!</p>
      <button class="btn" onclick="startGame()">खेल शुरू करें</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h2>खेल समाप्त!</h2>
      <p>आपका कुल अंक: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">पुनः प्रयास करें</button>
    </div>
  </div>

  <!-- Touch/Click Controls for Mobile & Desktop -->
  <div class="controls">
    <button class="control-btn" id="left-btn">◄</button>
    <button class="control-btn" id="right-btn">►</button>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const mitthu = document.getElementById('mitthu');
    const scoreElem = document.getElementById('score');
    const livesElem = document.getElementById('lives');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const finalScoreElem = document.getElementById('final-score');

    const containerWidth = 400;
    const mitthuWidth = 60;
    
    let mitthuX = 170;
    let score = 0;
    let lives = 3;
    let gameInterval;
    let spawnInterval;
    let isGameRunning = false;
    let items = [];

    // Movement speeds
    const moveSpeed = 20;

    // Item types: food gives points, hazard takes a life
    const itemTypes = [
      { type: 'banana', icon: '🍌', points: 10, speed: 4, chance: 0.5 },
      { type: 'gram', icon: '🫘', points: 5, speed: 5, chance: 0.3 },
      { type: 'claw', icon: '🐾', points: -1, speed: 6, chance: 0.2 }
    ];

    // Listen to Keyboard Controls
    document.addEventListener('keydown', (e) => {
      if (!isGameRunning) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        moveLeft();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        moveRight();
      }
    });

    // Mobile Button Controls
    document.getElementById('left-btn').addEventListener('click', moveLeft);
    document.getElementById('right-btn').addEventListener('click', moveRight);

    function moveLeft() {
      if (mitthuX > 0) {
        mitthuX -= moveSpeed;
        if (mitthuX < 0) mitthuX = 0;
        mitthu.style.left = mitthuX + 'px';
      }
    }

    function moveRight() {
      if (mitthuX < containerWidth - mitthuWidth) {
        mitthuX += moveSpeed;
        if (mitthuX > containerWidth - mitthuWidth) mitthuX = containerWidth - mitthuWidth;
        mitthu.style.left = mitthuX + 'px';
      }
    }

    function startGame() {
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      resetData();
      isGameRunning = true;
      
      // Game loop
      gameInterval = setInterval(updateGame, 1000 / 60);
      // Spawn items
      spawnInterval = setInterval(spawnItem, 900);
    }

    function resetData() {
      score = 0;
      lives = 3;
      mitthuX = 170;
      mitthu.style.left = mitthuX + 'px';
      scoreElem.innerText = score;
      livesElem.innerText = lives;

      // Clear existing items
      items.forEach(item => item.element.remove());
      items = [];
    }

    function spawnItem() {
      if (!isGameRunning) return;

      // Select item type based on probability
      const rand = Math.random();
      let selectedType = itemTypes[0];
      if (rand > 0.8) {
        selectedType = itemTypes[2]; // Claw hazard
      } else if (rand > 0.5) {
        selectedType = itemTypes[1]; // Grams
      }

      const itemElem = document.createElement('div');
      itemElem.className = 'falling-item';
      itemElem.innerText = selectedType.icon;
      
      const xPos = Math.floor(Math.random() * (containerWidth - 40));
      itemElem.style.left = xPos + 'px';
      itemElem.style.top = '0px';

      container.appendChild(itemElem);

      items.push({
        element: itemElem,
        x: xPos,
        y: 0,
        speed: selectedType.speed,
        type: selectedType.type,
        points: selectedType.points
      });
    }

    function updateGame() {
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed;
        item.element.style.top = item.y + 'px';

        // Collision check with Mitthu
        if (item.y >= 430 && item.y <= 470) {
          if (item.x + 30 >= mitthuX && item.x <= mitthuX + mitthuWidth) {
            handleCollision(item);
            item.element.remove();
            items.splice(i, 1);
            continue;
          }
        }

        // Missed item (off bottom screen)
        if (item.y > 500) {
          item.element.remove();
          items.splice(i, 1);
        }
      }
    }

    function handleCollision(item) {
      if (item.type === 'claw') {
        lives -= 1;
        livesElem.innerText = lives;
        if (lives <= 0) {
          endGame();
        }
      } else {
        score += item.points;
        scoreElem.innerText = score;
      }
    }

    function endGame() {
      isGameRunning = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      finalScoreElem.innerText = score;
      gameoverOverlay.style.display = 'flex';
    }

    function restartGame() {
      startGame();
    }
  </script>
</body>
</html>
