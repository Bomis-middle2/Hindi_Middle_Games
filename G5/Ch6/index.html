<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मिट्ठू और गोपाल - शब्द ज्ञान एवं कारक यात्रा</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .main-card {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 20px;
      text-align: center;
      border: 3px solid #4caf50;
    }

    h1 {
      color: #2e7d32;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .sub-title {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* Progress Tracker */
    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      background: #f1f8e9;
      padding: 10px;
      border-radius: 30px;
      border: 1px solid #a5d6a7;
    }

    .step {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .step.active {
      background: #ff9800;
      color: white;
    }

    .step.completed {
      background: #4caf50;
      color: white;
    }

    /* Question Container */
    .question-box {
      background: #f9f9f9;
      border: 2px dashed #81c784;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .question-text {
      font-size: 1.15rem;
      color: #1b5e20;
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #a5d6a7;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      color: #2e7d32;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #e8f5e9;
      transform: translateY(-2px);
    }

    .option-btn.correct {
      background: #4caf50 !important;
      color: white !important;
      border-color: #2e7d32 !important;
    }

    .option-btn.wrong {
      background: #f44336 !important;
      color: white !important;
      border-color: #c62828 !important;
    }

    /* Status & Navigation */
    .feedback {
      font-size: 1rem;
      font-weight: bold;
      min-height: 25px;
      margin-bottom: 15px;
    }

    .action-btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      width: 100%;
    }

    .action-btn:hover {
      background: #1b5e20;
    }

    /* Score Badge */
    .score-badge {
      font-size: 0.95rem;
      color: #333;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <h1>🐒 मिट्ठू और गोपाल यात्रा 🎪</h1>
    <p class="sub-title">शब्द ज्ञान और कारक अभ्यास (अध्याय 6)</p>

    <!-- Step Progress -->
    <div class="progress-bar">
      <div class="step active" id="step-1">1</div>
      <div class="step" id="step-2">2</div>
      <div class="step" id="step-3">3</div>
      <div class="step" id="step-4">4</div>
      <div class="step" id="step-5">5</div>
    </div>

    <!-- Question Box -->
    <div class="question-box">
      <div class="question-text" id="question-text">प्रश्न लोड हो रहा है...</div>
    </div>

    <!-- Options -->
    <div class="options-grid" id="options-container">
      <!-- Buttons dynamically loaded -->
    </div>

    <div class="feedback" id="feedback-text"></div>

    <button class="action-btn" id="next-btn" onclick="nextQuestion()">अगला पड़ाव ➔</button>

    <div class="score-badge">अंक: <span id="score">0</span> / 50</div>
  </div>

  <script>
    // Chapter 6 Questions based on vocabulary and Karak grammar
    const questions = [
      {
        q: "1. '50 पैसे के सिक्के' को क्या कहा जाता है?",
        options: ["दुष्ट", "अठन्नी", "सर्कस कंपनी", "दोस्ती"],
        ans: 1,
        fact: "पाठ में गोपाल अठन्नी लेकर मिट्ठू को खरीदने सर्कस गया था।"
      },
      {
        q: "2. 'चोट लग जाना' के लिए सही शब्द चुनिए:",
        options: ["मालिक", "खोया हुआ", "शंका", "घायल"],
        ans: 3,
        fact: "जब मिट्ठू चीते के पंजे से घायल हुआ, तो गोपाल बहुत रोया।"
      },
      {
        q: "3. 'गोपाल ने मिट्ठू को केला खिलाया।' - इस वाक्य में 'ने' कौन सा कारक है?",
        options: ["कर्म कारक", "अपादान कारक", "कर्ता कारक", "संबंध कारक"],
        ans: 2,
        fact: "कार्य करने वाले को कर्ता कारक कहते हैं, जिसका चिह्न 'ने' है।"
      },
      {
        q: "4. 'संदेह' या 'शक' शब्द के लिए पाठ के अनुसार सही शब्द क्या है?",
        options: ["शंका", "अठन्नी", "मालिक", "घायल"],
        ans: 0,
        fact: "'शंका' का अर्थ संदेह या शक होता है।"
      },
      {
        q: "5. 'मिट्ठू पिंजरे से बाहर आया।' - यहाँ 'से' (अलग होना) कौन सा कारक है?",
        options: ["करण कारक", "अपादान कारक", "संबोधन कारक", "कर्म कारक"],
        ans: 1,
        fact: "जहाँ किसी वस्तु/जीव का अलग होना प्रकट हो, वहाँ 'अपादान कारक' होता है।"
      }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
      answered = false;
      const qData = questions[currentQ];
      
      document.getElementById('question-text').innerText = qData.q;
      document.getElementById('feedback-text').innerText = '';
      document.getElementById('next-btn').style.display = 'none';

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, btn);
        optionsContainer.appendChild(btn);
      });

      updateProgress();
    }

    function checkAnswer(selectedIdx, btnElement) {
      if (answered) return;
      answered = true;

      const qData = questions[currentQ];
      const allBtns = document.querySelectorAll('.option-btn');

      if (selectedIdx === qData.ans) {
        btnElement.classList.add('correct');
        document.getElementById('feedback-text').style.color = '#2e7d32';
        document.getElementById('feedback-text').innerText = `सही उत्तर! ✨ (${qData.fact})`;
        score += 10;
        document.getElementById('score').innerText = score;
      } else {
        btnElement.classList.add('wrong');
        allBtns[qData.ans].classList.add('correct');
        document.getElementById('feedback-text').style.color = '#c62828';
        document.getElementById('feedback-text').innerText = `गलत! सही उत्तर: ${qData.options[qData.ans]}`;
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function updateProgress() {
      for (let i = 1; i <= 5; i++) {
        const step = document.getElementById(`step-${i}`);
        if (i - 1 < currentQ) {
          step.className = 'step completed';
        } else if (i - 1 === currentQ) {
          step.className = 'step active';
        } else {
          step.className = 'step';
        }
      }
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('question-text').innerHTML = `🎉 <strong>यात्रा पूरी हुई!</strong><br><br>आपका कुल स्कोर: ${score} / 50`;
      document.getElementById('options-container').innerHTML = '';
      document.getElementById('feedback-text').innerText = score >= 40 ? 'शाबाश! आपने पाठ और व्याकरण बहुत अच्छे से समझा है!' : 'अच्छा प्रयास! दोबारा खेलकर पूरे अंक प्राप्त करें।';
      
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = 'पुनः खेलें 🔄';
      nextBtn.style.display = 'block';
      nextBtn.onclick = restartGame;
    }

    function restartGame() {
      currentQ = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = 'अगला पड़ाव ➔';
      nextBtn.onclick = nextQuestion;
      loadQuestion();
    }

    // Initialize game
    loadQuestion();
  </script>
</body>
</html>
